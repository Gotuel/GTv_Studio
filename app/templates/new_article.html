{% extends "base.html" %}{% block title %}Nouveau contenu · GTv Studio{% endblock %}
{% block content %}<div class="section-heading"><div><p class="eyebrow accent">NOUVEAU TRAITEMENT</p><h1>Donnez-nous la matière.</h1><p class="lead">Commencez par votre contenu brut, l'IA s'occupe de la suite.</p></div></div>
<div class="editor-intro"><span class="editor-step active">01 <b>Source</b></span><i></i><span class="editor-step">02 <b>Article</b></span><i></i><span class="editor-step">03 <b>Audio</b></span></div><form method="post" class="form-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Titre ou sujet<input name="title" required value="{{ form.get('title','') }}" placeholder="Ex. Lancement de la campagne de vaccination"></label><div class="two-col"><label>Catégorie<select name="category_id" required>{% for category in categories %}<option value="{{ category.id }}" {% if form.get('category_id', '1')|int == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label><label>Source<input name="source" value="{{ form.get('source','') }}" placeholder="Nom ou lien de la source"></label></div><label>Contenu brut<textarea name="raw_content" required rows="12" placeholder="Collez ici votre dépêche, transcription ou notes...">{{ form.get('raw_content','') }}</textarea></label><div class="two-col"><label>Niveau de rédaction<select name="level"><option value="basic">Basique — court et factuel</option><option value="intermediate" selected>Intermédiaire — contextualisé</option><option value="professional">Professionnel — approfondi</option></select></label><label>Langue<select name="language"><option value="fr">Français</option><option value="en">English</option></select></label></div><div class="form-actions"><a class="button ghost" href="{{ url_for('main.dashboard') }}">Annuler</a><button class="button primary" type="submit">Sauvegarder le brouillon <span>→</span></button></div></form>{% endblock %}
